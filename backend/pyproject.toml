[project]
name = "df-openrouter-dispatch-backend"
version = "1.0.0"
description = "OpenRouter Dispatch - FastAPI Backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "httpx>=0.28",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "cryptography>=43.0",
    "uuid-utils>=0.10",
    "python-multipart>=0.0.12",
    "seqlog>=0.4.3",
    "jinja2>=3.1",
    "taskiq>=0.12",
    "taskiq-redis>=1.2",
    "boto3>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM"]
ignore = ["E501"]

# FastAPI 慣例:Query / Depends / Path 等需於參數預設值呼叫,非 B008 違規。
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Query",
    "fastapi.Depends",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Form",
    "fastapi.File",
]

[tool.mypy]

# boto3 / botocore / seqlog 皆未附 py.typed(無型別資訊),缺少 stub 不應視為型別錯誤。
# (seqlog 為既有相依,原本就讓 `mypy` 對 app/core/logging.py 報 import-untyped。)
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "seqlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
