services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* 必須於 build 階段帶入才會進 client bundle
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    environment:
      SERVICE_URL_FRONTEND_3000:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    expose:
      - "3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVICE_URL_BACKEND_8000:
      APP_ENV: ${APP_ENV}
      APP_NAME: backend
      LOG_LEVEL: ${LOG_LEVEL}
      UVICORN_WORKERS: ${UVICORN_WORKERS}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRES_MINUTES: ${ACCESS_TOKEN_EXPIRES_MINUTES}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS}
      ACCESS_COOKIE_NAME: ${ACCESS_COOKIE_NAME}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      INITIAL_ADMIN_ACCOUNT: ${INITIAL_ADMIN_ACCOUNT}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      SSO_URL: ${SSO_URL}
      SSO_APP_ID: ${SSO_APP_ID}
      SSO_APP_SECRET: ${SSO_APP_SECRET}
      SSO_TIMEOUT_SECONDS: "8"
      BACKEND_URL: ${BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      OPENROUTER_API_BASE_URL: ${OPENROUTER_API_BASE_URL}
      OPENROUTER_API_TIMEOUT: ${OPENROUTER_API_TIMEOUT}
      DEFAULT_OPENROUTER_KEY: ${DEFAULT_OPENROUTER_KEY}
      SEQ_INGESTION_URL: http://seq
      SEQ_API_KEY: ${SEQ_API_KEY}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
      seq:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  alembic:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:4.8.1-standalone
    environment:
      SERVICE_URL_ADMINER_8080:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DB_DRIVER: pgsql
      ADMINER_DESIGN: pepa-linha
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SERVICE_URL_SEQ_80:
      SEQ_FIRSTRUN_ADMINUSERNAME: admin
      # 由 Coolify Environment Variables 注入(後端部署時產生隨機密碼寫入)
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_FIRSTRUN_ADMINPASSWORD}
    expose:
      - "80"
    volumes:
      - seq-data:/data

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME}-postgres-data
  seq-data:
    name: ${COMPOSE_PROJECT_NAME}-seq-data
