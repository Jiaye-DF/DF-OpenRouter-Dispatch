services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* 必須於 build 階段帶入才會進 client bundle
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    environment:
      SERVICE_URL_FRONTEND_3000:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    expose:
      - "3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVICE_URL_BACKEND_8000:
      APP_ENV: ${APP_ENV}
      APP_NAME: backend
      LOG_LEVEL: ${LOG_LEVEL}
      UVICORN_WORKERS: ${UVICORN_WORKERS}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRES_MINUTES: ${ACCESS_TOKEN_EXPIRES_MINUTES}
      REFRESH_TOKEN_EXPIRES_DAYS: ${REFRESH_TOKEN_EXPIRES_DAYS}
      ACCESS_COOKIE_NAME: ${ACCESS_COOKIE_NAME}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME}
      CORS_ORIGINS: ${CORS_ORIGINS}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      INITIAL_ADMIN_ACCOUNT: ${INITIAL_ADMIN_ACCOUNT}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL}
      SSO_URL: ${SSO_URL}
      SSO_APP_ID: ${SSO_APP_ID}
      SSO_APP_SECRET: ${SSO_APP_SECRET}
      SSO_TIMEOUT_SECONDS: "8"
      BACKEND_URL: ${BACKEND_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      OPENROUTER_API_BASE_URL: ${OPENROUTER_API_BASE_URL}
      OPENROUTER_API_TIMEOUT: ${OPENROUTER_API_TIMEOUT}
      DEFAULT_OPENROUTER_KEY: ${DEFAULT_OPENROUTER_KEY}
      # AI 評審 / taskiq + Redis(v2.0);compose 內 Redis 主機名為 redis 服務
      AI_EVAL_ENABLED: ${AI_EVAL_ENABLED}
      TASKIQ_BROKER_URL: redis://redis:6379/0
      TASKIQ_RESULT_BACKEND_URL: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/2
      AI_EVAL_BEAT_INTERVAL_SECONDS: ${AI_EVAL_BEAT_INTERVAL_SECONDS}
      AI_EVAL_DISPATCH_BATCH_SIZE: ${AI_EVAL_DISPATCH_BATCH_SIZE}
      AI_EVAL_TASK_MAX_RETRIES: ${AI_EVAL_TASK_MAX_RETRIES}
      # AI 分析起始時間門檻:只分析 created_at >= 此時間的資料(空=不設限)
      AI_EVAL_START_AT: ${AI_EVAL_START_AT}
      # AI 真實重跑 + 對比裁決(v2.1);沿用評審派發排程,僅兩顆開關
      AI_RERUN_ENABLED: ${AI_RERUN_ENABLED}
      AI_RERUN_DISCRIMINATOR_ENABLED: ${AI_RERUN_DISCRIMINATOR_ENABLED}
      # M365 Mail 服務(開通完成 Email 通知,Microsoft Graph);值由 Coolify 注入
      M365_CLIENT_ID: ${M365_CLIENT_ID}
      M365_TENANT_ID: ${M365_TENANT_ID}
      M365_CLIENT_SECRET: ${M365_CLIENT_SECRET}
      M365_MAIL_SENDER: ${M365_MAIL_SENDER}
      # 申請單管理員通知開關(v2.2);於 API 進程觸發
      APIREQ_ADMIN_NOTIFY_ENABLED: ${APIREQ_ADMIN_NOTIFY_ENABLED}
      # S3 物件儲存(v2.2.1);代理寫入端落地附件 + 管理端 presign,
      # 遷移 script(scripts/migrate_base64_to_s3.py)亦於本容器內執行,故七顆都要。
      # AWS_* 為機密,值一律由 Coolify Environment Variables 注入,禁寫實值。
      S3_STORAGE_ENABLED: ${S3_STORAGE_ENABLED}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX}
      S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS}
      SEQ_INGESTION_URL: http://seq
      SEQ_API_KEY: ${SEQ_API_KEY}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
      seq:
        condition: service_started
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  alembic:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  adminer:
    image: adminer:4.8.1-standalone
    environment:
      SERVICE_URL_ADMINER_8080:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_DB_DRIVER: pgsql
      ADMINER_DESIGN: pepa-linha
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SERVICE_URL_SEQ_80:
      SEQ_FIRSTRUN_ADMINUSERNAME: admin
      # 由 Coolify Environment Variables 注入(後端部署時產生隨機密碼寫入)
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_FIRSTRUN_ADMINPASSWORD}
    expose:
      - "80"
    volumes:
      - seq-data:/data

  redis:
    image: redis:8.6-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  taskiq-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["taskiq", "worker", "app.tasks.broker:broker", "app.tasks.ai_model_eval", "app.tasks.model_sync"]
    environment:
      APP_ENV: ${APP_ENV}
      APP_NAME: taskiq-worker
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OPENROUTER_API_BASE_URL: ${OPENROUTER_API_BASE_URL}
      OPENROUTER_API_TIMEOUT: ${OPENROUTER_API_TIMEOUT}
      DEFAULT_OPENROUTER_KEY: ${DEFAULT_OPENROUTER_KEY}
      AI_EVAL_ENABLED: ${AI_EVAL_ENABLED}
      TASKIQ_BROKER_URL: redis://redis:6379/0
      TASKIQ_RESULT_BACKEND_URL: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/2
      AI_EVAL_BEAT_INTERVAL_SECONDS: ${AI_EVAL_BEAT_INTERVAL_SECONDS}
      AI_EVAL_DISPATCH_BATCH_SIZE: ${AI_EVAL_DISPATCH_BATCH_SIZE}
      AI_EVAL_TASK_MAX_RETRIES: ${AI_EVAL_TASK_MAX_RETRIES}
      # AI 分析起始時間門檻:只分析 created_at >= 此時間的資料(空=不設限)
      AI_EVAL_START_AT: ${AI_EVAL_START_AT}
      # AI 真實重跑 + 對比裁決(v2.1);沿用評審派發排程,僅兩顆開關
      AI_RERUN_ENABLED: ${AI_RERUN_ENABLED}
      AI_RERUN_DISCRIMINATOR_ENABLED: ${AI_RERUN_DISCRIMINATOR_ENABLED}
      # 模型自動同步排程(v2.2);worker 註冊 scheduled_sync_models
      MODEL_SYNC_SCHEDULE_ENABLED: ${MODEL_SYNC_SCHEDULE_ENABLED}
      MODEL_SYNC_INTERVAL_DAYS: ${MODEL_SYNC_INTERVAL_DAYS}
      SEQ_INGESTION_URL: http://seq
      SEQ_API_KEY: ${SEQ_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
      seq:
        condition: service_started

  taskiq-scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["taskiq", "scheduler", "app.tasks.scheduler:scheduler"]
    environment:
      APP_ENV: ${APP_ENV}
      APP_NAME: taskiq-scheduler
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AI_EVAL_ENABLED: ${AI_EVAL_ENABLED}
      TASKIQ_BROKER_URL: redis://redis:6379/0
      TASKIQ_RESULT_BACKEND_URL: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/2
      AI_EVAL_BEAT_INTERVAL_SECONDS: ${AI_EVAL_BEAT_INTERVAL_SECONDS}
      AI_EVAL_DISPATCH_BATCH_SIZE: ${AI_EVAL_DISPATCH_BATCH_SIZE}
      AI_EVAL_TASK_MAX_RETRIES: ${AI_EVAL_TASK_MAX_RETRIES}
      # AI 分析起始時間門檻:只分析 created_at >= 此時間的資料(空=不設限)
      AI_EVAL_START_AT: ${AI_EVAL_START_AT}
      # AI 真實重跑 + 對比裁決(v2.1);沿用評審派發排程,僅兩顆開關
      AI_RERUN_ENABLED: ${AI_RERUN_ENABLED}
      AI_RERUN_DISCRIMINATOR_ENABLED: ${AI_RERUN_DISCRIMINATOR_ENABLED}
      # 模型自動同步排程(v2.2);scheduler cron label 於 import 時讀該 env
      MODEL_SYNC_SCHEDULE_ENABLED: ${MODEL_SYNC_SCHEDULE_ENABLED}
      MODEL_SYNC_INTERVAL_DAYS: ${MODEL_SYNC_INTERVAL_DAYS}
      SEQ_INGESTION_URL: http://seq
      SEQ_API_KEY: ${SEQ_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
      seq:
        condition: service_started

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME}-postgres-data
  seq-data:
    name: ${COMPOSE_PROJECT_NAME}-seq-data
  redis-data:
    name: ${COMPOSE_PROJECT_NAME}-redis-data
