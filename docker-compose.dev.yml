services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    # 每次容器啟動先清除 Next.js 建置快取(.next),避免 stale cache
    command: ["sh", "-c", "rm -rf .next && npm run dev"]
    env_file: .env
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL}
      # Windows / Docker bind mount 下檔案監看收不到 inotify 事件,
      # 開啟輪詢讓 hot-reload 可靠生效。
      - WATCHPACK_POLLING=true
    ports:
      - "3300:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    env_file: .env
    ports:
      - "8800:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully

  postgres:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "5533:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  alembic:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    env_file: .env
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
    name: ${COMPOSE_PROJECT_NAME}-postgres-data-dev
